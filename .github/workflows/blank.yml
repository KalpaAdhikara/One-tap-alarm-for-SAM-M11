name: Build One Tap Alarm APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-extract ZIP if uploaded directly
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file in repository, extracting..."
            unzip -o *.zip
            if [ -d "OneTapAlarm" ]; then
              cp -rn OneTapAlarm/* . 2>/dev/null || true
              cp -rn OneTapAlarm/.[!.]* . 2>/dev/null || true
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneTapAlarm-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
