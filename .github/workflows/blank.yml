name: Build One Tap Alarm APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate complete OneTapAlarm source code
        run: |
          mkdir -p app/src/main/java/com/onetap/alarm

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OneTapAlarm"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.onetap.alarm"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.onetap.alarm"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_lock_idle_alarm"
                  android:label="One Tap Alarm"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/onetap/alarm/MainActivity.kt
          package com.onetap.alarm

          import android.app.TimePickerDialog
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.AlarmClock
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.cardview.widget.CardView
          import java.util.Calendar

          class MainActivity : AppCompatActivity() {

              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      isFillViewport = true
                  }

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 60)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  val titleView = TextView(this).apply {
                      text = "One Tap Alarm"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  rootLayout.addView(titleView)

                  val subtitleView = TextView(this).apply {
                      text = "Tap any preset to set your Samsung Clock alarm instantly"
                      textSize = 13f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 30)
                  }
                  rootLayout.addView(subtitleView)

                  statusText = TextView(this).apply {
                      text = "Ready to set alarm"
                      textSize = 14f
                      setTextColor(Color.parseColor("#34D399"))
                      gravity = Gravity.CENTER
                      setPadding(20, 20, 20, 20)
                  }
                  val statusCard = CardView(this).apply {
                      radius = 24f
                      setCardBackgroundColor(Color.parseColor("#064E3B"))
                      addView(statusText)
                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, 40) }
                      layoutParams = params
                  }
                  rootLayout.addView(statusCard)

                  val presets = listOf(
                      Pair("5:00 AM", Pair(5, 0)),
                      Pair("5:30 AM", Pair(5, 30)),
                      Pair("6:00 AM", Pair(6, 0)),
                      Pair("6:30 AM", Pair(6, 30)),
                      Pair("7:00 AM", Pair(7, 0)),
                      Pair("7:30 AM", Pair(7, 30)),
                      Pair("8:00 AM", Pair(8, 0)),
                      Pair("8:30 AM", Pair(8, 30)),
                      Pair("9:00 AM", Pair(9, 0)),
                      Pair("9:30 AM", Pair(9, 30))
                  )

                  val grid = GridLayout(this).apply {
                      columnCount = 2
                      rowCount = 5
                      alignmentMode = GridLayout.ALIGN_MARGINS
                      useDefaultMargins = true
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  }

                  presets.forEach { (label, time) ->
                      val btn = Button(this).apply {
                          text = "$label\nOne Tap"
                          textSize = 15f
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#1E293B"))
                          setOnClickListener {
                              setAlarm(time.first, time.second, label)
                          }
                      }
                      val specRow = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                      val specCol = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                      val params = GridLayout.LayoutParams(specRow, specCol).apply {
                          width = 0
                          height = 180
                          setMargins(12, 12, 12, 12)
                      }
                      btn.layoutParams = params
                      grid.addView(btn)
                  }
                  rootLayout.addView(grid)

                  val customBtn = Button(this).apply {
                      text = "Pick Custom Time"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#4F46E5"))
                      setPadding(0, 30, 0, 30)
                      setOnClickListener {
                          val cal = Calendar.getInstance()
                          TimePickerDialog(
                              this@MainActivity,
                              { _, hour, minute ->
                                  val amPm = if (hour < 12) "AM" else "PM"
                                  val displayH = if (hour == 0) 12 else if (hour > 12) hour - 12 else hour
                                  val formatted = String.format("%d:%02d %s", displayH, minute, amPm)
                                  setAlarm(hour, minute, formatted)
                              },
                              cal.get(Calendar.HOUR_OF_DAY),
                              cal.get(Calendar.MINUTE),
                              false
                          ).show()
                      }
                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(12, 30, 12, 20) }
                      layoutParams = params
                  }
                  rootLayout.addView(customBtn)

                  scrollView.addView(rootLayout)
                  setContentView(scrollView)
              }

              private fun setAlarm(hour: Int, minute: Int, label: String) {
                  try {
                      val intent = Intent(AlarmClock.ACTION_SET_ALARM).apply {
                          putExtra(AlarmClock.EXTRA_HOUR, hour)
                          putExtra(AlarmClock.EXTRA_MINUTES, minute)
                          putExtra(AlarmClock.EXTRA_MESSAGE, "One Tap Alarm")
                          putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      }
                      if (intent.resolveActivity(packageManager) != null) {
                          startActivity(intent)
                          statusText.text = "Last requested: $label"
                          Toast.makeText(this, "Alarm requested for $label", Toast.LENGTH_SHORT).show()
                      } else {
                          val clockIntent = Intent(AlarmClock.ACTION_SHOW_ALARMS)
                          if (clockIntent.resolveActivity(packageManager) != null) {
                              startActivity(clockIntent)
                          } else {
                              Toast.makeText(this, "No Clock app found on this device", Toast.LENGTH_LONG).show()
                          }
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "Could not set alarm: ${e.localizedMessage}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneTapAlarm-debug-apk
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
